<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6fa">
<title>Cal Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#fff6fa;--pink:#ff7aa8;--peach:#ffb48a;--lilac:#b79cff;--mint:#5fd3b0;--ink:#3b2f3a;--mute:#a093a0;--line:#f6e3ec}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:400 15px/1.5 Prompt,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 100px}
.wrap{max-width:480px;margin:auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.top b{font-size:21px;font-weight:600}
.ib{border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:17px;color:var(--ink);box-shadow:0 2px 10px #ff7aa826;flex:none}
.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #ff7aa81a}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.p{border:0;border-radius:16px;padding:13px;background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff;font:500 16px Prompt;width:100%}
input{font:inherit;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-width:0;background:#fff;color:var(--ink);outline:0}
input:focus{border-color:var(--pink)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.nav button{border:0;background:0;font:500 12px Prompt;color:var(--mute);display:flex;flex-direction:column;align-items:center;width:30%;font-size:12px}
.nav button.on{color:var(--pink)}
.nav .fab{width:58px;height:58px;border-radius:50%;margin-top:-32px;background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff;font-size:32px;justify-content:center;box-shadow:0 6px 18px #ff7aa86b}
.em{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.it span:first-child{flex:1}.it button{border:0;background:0;color:#d9b9c8;font-size:15px}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
.mid b{font-size:34px;font-weight:600;line-height:1.1}
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:0;padding:8px;border-radius:12px;font:500 14px Prompt;color:var(--mute)}
.seg .on{background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
h2{font-size:28px;font-weight:600;color:var(--pink);line-height:1.2}
.sh{position:fixed;inset:0;background:#3b2f3a66;z-index:9;display:flex;align-items:flex-end}
.pan{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:400 14px Prompt;white-space:nowrap;color:var(--ink)}
.chips .on{background:#ffe3ee;border-color:var(--pink);color:var(--pink)}
.fr{display:flex;justify-content:space-between;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.fr b{color:var(--pink)}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;z-index:20;font-size:14px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Cal Diary 🌷</b><button class="ib" onclick="go('g')">⚙️</button></div>
  <div id="v"></div>
</div>

<div class="nav">
  <button data-t="h" onclick="go('h')">🏠<span>วันนี้</span></button>
  <button class="fab" onclick="openSh()">+</button>
  <button data-t="s" onclick="go('s')">📊<span>สรุป</span></button>
</div>

<div class="sh" id="sh" hidden onclick="if(event.target==this)closeSh()">
  <div class="pan">
    <div class="row"><b style="font-size:18px">เพิ่มอาหาร</b><span class="sp"></span><button class="ib" onclick="closeSh()">✕</button></div>
    <p class="mute" id="sd"></p>
    <div class="chips" id="mc"></div>
    <div class="row">
      <input id="q" placeholder="ค้นหาอาหาร เช่น ข้าวมันไก่" oninput="find()">
      <button class="ib" style="width:46px;height:46px" onclick="$('#ph').click()">📷</button>
    </div>
    <input type="file" id="ph" accept="image/*" hidden onchange="scan(this)">
    <p class="mute" id="ld" hidden style="padding:10px 0"></p>
    <div id="rs"></div>
    <div id="dr" hidden style="background:#fff6fa;border-radius:18px;padding:14px;margin-top:12px">
      <img id="pv" hidden style="width:100%;border-radius:14px;max-height:170px;object-fit:cover;margin-bottom:10px">
      <input id="dn" placeholder="ชื่ออาหาร">
      <div class="row" style="margin:12px 0">
        <button class="ib" onclick="qt(-.5)">−</button><b id="qv" style="min-width:34px;text-align:center">1</b><button class="ib" onclick="qt(.5)">+</button>
        <span class="sp"></span>
        <input id="kc" type="number" inputmode="numeric" style="width:90px;text-align:right"><span>kcal</span>
      </div>
      <p class="mute" id="nt" style="margin-bottom:10px"></p>
      <button class="p" onclick="save()">บันทึก</button>
    </div>
  </div>
</div>
<div id="t" hidden></div>

<script>
const $=s=>document.querySelector(s);
const MEALS=[{k:'เช้า',e:'🥐',c:'#ffb48a'},{k:'กลางวัน',e:'🍜',c:'#ff7aa8'},{k:'เย็น',e:'🍛',c:'#b79cff'},{k:'ของว่าง',e:'🧁',c:'#5fd3b0'}];
// ชื่อ,หน่วย,kcal (ค่าประมาณ)
const FOODS=`ข้าวสวย,1 จาน,260
ข้าวเหนียว,1 ห่อ,200
ข้าวมันไก่,1 จาน,590
ข้าวผัดหมู,1 จาน,520
ข้าวผัดกุ้ง,1 จาน,500
ข้าวกะเพราหมูสับไข่ดาว,1 จาน,620
ข้าวหมูทอดกระเทียม,1 จาน,580
ข้าวหมูแดง,1 จาน,500
ข้าวหน้าเป็ด,1 จาน,550
ข้าวขาหมู,1 จาน,650
ข้าวไข่เจียว,1 จาน,520
ข้าวต้มหมู,1 ชาม,250
โจ๊กหมู,1 ชาม,230
ผัดไทย,1 จาน,600
ผัดซีอิ๊ว,1 จาน,580
ราดหน้า,1 จาน,450
ก๋วยเตี๋ยวน้ำใส,1 ชาม,300
ก๋วยเตี๋ยวเรือ,1 ชาม,320
บะหมี่เกี๊ยว,1 ชาม,380
ก๋วยจั๊บ,1 ชาม,350
ขนมจีนน้ำยา,1 จาน,380
สุกี้น้ำ,1 ชาม,300
ต้มยำกุ้ง,1 ถ้วย,150
แกงเขียวหวานไก่,1 ถ้วย,320
แกงจืดเต้าหู้หมูสับ,1 ถ้วย,100
ส้มตำไทย,1 จาน,120
ลาบหมู,1 จาน,200
ไก่ย่าง,1 ชิ้น,250
ไก่ทอด,1 ชิ้น,290
หมูปิ้ง,1 ไม้,110
อกไก่ต้ม,100 ก.,165
ไข่ต้ม,1 ฟอง,75
ไข่ดาว,1 ฟอง,110
ไข่เจียว,1 ฟอง,200
ผัดผักรวม,1 จาน,150
สลัดผัก,1 ถ้วย,120
ขนมปังปิ้ง,1 แผ่น,80
แซนด์วิชทูน่า,1 ชิ้น,300
ข้าวโอ๊ต,1 ถ้วย,150
โยเกิร์ตรสธรรมชาติ,1 ถ้วย,100
นมสด,1 กล่อง,130
กล้วยหอม,1 ลูก,90
แอปเปิล,1 ลูก,80
ส้ม,1 ผล,60
แตงโม,1 ชิ้นใหญ่,50
มะม่วงสุก,1/2 ผล,100
ข้าวเหนียวมะม่วง,1 จาน,420
ไอศกรีม,1 สกู๊ป,140
เค้ก,1 ชิ้น,350
คุกกี้,1 ชิ้น,70
ชานมไข่มุก,1 แก้ว,450
กาแฟลาเต้,1 แก้ว,150
อเมริกาโน่,1 แก้ว,10
ชาเขียวเย็น,1 แก้ว,300
น้ำอัดลม,1 กระป๋อง,140
เฟรนช์ฟรายส์,1 ถุงกลาง,320
พิซซ่า,1 ชิ้น,280
แฮมเบอร์เกอร์,1 ชิ้น,500`.split('\n').map(l=>{const a=l.split(',');return[a[0],a[1],+a[2]]});

const S=Object.assign({url:'',goal:1800},JSON.parse(localStorage.cal||'{}'));
let rows=JSON.parse(localStorage.rows||'[]'),tab='h',T=1,cur=fmt(new Date()),meal,base=0,qty=1,ch1,ch2;
const sv=()=>localStorage.cal=JSON.stringify(S), cache=()=>localStorage.rows=JSON.stringify(rows);
const sum=l=>l.reduce((a,r)=>a+(+r.kcal||0),0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function fmt(d){return d.toLocaleDateString('sv-SE')}
function label(d){return d==fmt(new Date())?'วันนี้':new Date(d+'T12:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}
const api=async b=>(await fetch(S.url,{method:'POST',body:JSON.stringify(b)})).json();
function toast(m){const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(t._);t._=setTimeout(()=>t.hidden=true,2800)}
function busy(m){$('#ld').textContent=m||'';$('#ld').hidden=!m}
const go=t=>{tab=t;render()};
function mv(n){const d=new Date(cur+'T12:00');d.setDate(d.getDate()+n);cur=fmt(d);render()}

function setup(){return `<div class="card" style="text-align:center;margin-top:20px"><div style="font-size:48px">🌸</div><h2 style="color:var(--ink)">ยินดีต้อนรับ</h2>
<p class="mute" style="margin:8px 0 16px">วางลิงก์ Web App ของ Google Apps Script<br>(ลงท้ายด้วย /exec) เพื่อเชื่อมกับ Google Sheet ของคุณ</p>
<input id="ul" placeholder="https://script.google.com/macros/s/.../exec" style="margin-bottom:12px"><button class="p" onclick="conn()">เชื่อมต่อ</button></div>`}

function home(){
  const rs=rows.filter(r=>r.date==cur),t=sum(rs),g=S.goal,off=327*(1-Math.min(1,t/g));
  return `<div class="row" style="justify-content:center;margin-bottom:12px"><button class="ib" onclick="mv(-1)">‹</button><b style="min-width:150px;text-align:center">${label(cur)}</b><button class="ib" onclick="mv(1)">›</button></div>
<div class="card" style="text-align:center"><div style="position:relative;width:190px;margin:auto"><svg viewBox="0 0 120 120"><defs><linearGradient id="g"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#ffb48a"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="#ffe3ee" stroke-width="11"/><circle cx="60" cy="60" r="52" fill="none" stroke="${t>g?'#b79cff':'url(#g)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/></svg><div class="mid"><b>${t}</b><span class="mute">จาก ${g} kcal</span></div></div>
<p class="mute">${t>g?`เกินเป้า ${t-g} kcal`:`เหลืออีก ${g-t} kcal`}</p></div>
${MEALS.map(m=>{const l=rs.filter(r=>r.meal==m.k);return `<div class="card"><div class="row"><span class="em" style="background:${m.c}33">${m.e}</span><b>${m.k}</b><span class="sp"></span><b style="color:${m.c}">${sum(l)} kcal</b></div>${l.map(r=>`<div class="it"><span>${esc(r.name)}</span><span class="mute">${r.kcal}</span><button onclick="del('${esc(r.id)}')">✕</button></div>`).join('')||'<p class="mute" style="margin-top:6px">ยังไม่ได้บันทึก กด + เพื่อเพิ่ม</p>'}</div>`}).join('')}`}

function calc(){
  const n=[1,7,30][T],days=[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-n+1+i);return fmt(d)}),
  rs=rows.filter(r=>days.includes(r.date)),sums=days.map(d=>sum(rs.filter(r=>r.date==d))),
  ms=MEALS.map(m=>sum(rs.filter(r=>r.meal==m.k))),tot=sum(rs),lg=sums.filter(x=>x).length||1;
  return{n,days,sums,ms,tot,avg:Math.round(tot/lg)}}

function stats(){const c=calc();return `<div class="seg">${['วัน','สัปดาห์','เดือน'].map((x,i)=>`<button class="${i==T?'on':''}" onclick="T=${i};render()">${x}</button>`).join('')}</div>
<div class="g2"><div class="card"><span class="mute">รวม (kcal)</span><h2>${c.tot}</h2></div><div class="card"><span class="mute">เฉลี่ย/วันที่บันทึก</span><h2>${c.avg}</h2></div></div>
<div class="card"><b>${['แต่ละมื้อวันนี้','7 วันล่าสุด','30 วันล่าสุด'][T]}</b><div style="height:210px;margin-top:8px"><canvas id="c1"></canvas></div></div>
<div class="card"><b>สัดส่วนแต่ละมื้อ</b><div style="height:170px;margin:8px 0"><canvas id="c2"></canvas></div>${MEALS.map((m,i)=>`<div class="row" style="padding:3px 0"><i style="width:10px;height:10px;border-radius:50%;background:${m.c}"></i>${m.e} ${m.k}<span class="sp"></span><b>${c.ms[i]}</b><span class="mute" style="width:44px;text-align:right">${c.tot?Math.round(c.ms[i]*100/c.tot):0}%</span></div>`).join('')}</div>`}

function draw(){
  const c=calc(),g=S.goal,one=c.n==1;[ch1,ch2].forEach(x=>x&&x.destroy());Chart.defaults.font.family='Prompt';
  ch1=new Chart($('#c1'),{type:'bar',data:{labels:one?MEALS.map(m=>m.k):c.days.map(d=>c.n==7?new Date(d+'T12:00').toLocaleDateString('th-TH',{weekday:'short'}):+d.slice(8)),
    datasets:[{data:one?c.ms:c.sums,backgroundColor:one?MEALS.map(m=>m.c):c.sums.map(v=>v>g?'#b79cff':'#ff7aa8'),borderRadius:8,maxBarThickness:30},
    ...(one?[]:[{type:'line',data:c.days.map(()=>g),borderColor:'#5fd3b0',borderDash:[5,5],pointRadius:0,borderWidth:2}])]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10}},y:{beginAtZero:true,grid:{color:'#f6e3ec'}}}}});
  ch2=new Chart($('#c2'),{type:'doughnut',data:{labels:MEALS.map(m=>m.k),datasets:[{data:c.ms,backgroundColor:MEALS.map(m=>m.c),borderWidth:3,borderColor:'#fff'}]},options:{maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}})}

function set(){return `<div class="card"><b>เป้าหมายแคลต่อวัน</b><input type="number" inputmode="numeric" value="${S.goal}" style="margin-top:8px" onchange="S.goal=+this.value||1800;sv()"><p class="mute" style="margin-top:6px">ผู้หญิงทั่วไปประมาณ 1,500–1,800 kcal</p></div>
<div class="card"><b>ลิงก์ Apps Script</b><input id="ul" value="${esc(S.url)}" style="margin:8px 0 12px"><button class="p" onclick="conn()">บันทึกลิงก์และโหลดข้อมูล</button></div>`}

function render(){
  if(!S.url){$('#v').innerHTML=setup();$('.nav').hidden=true;return}
  $('.nav').hidden=false;$('#v').innerHTML={h:home,s:stats,g:set}[tab]();if(tab=='s')draw();
  document.querySelectorAll('.nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}

async function conn(){
  const u=$('#ul').value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u))return toast('ลิงก์ต้องเป็น https://script.google.com/…/exec');
  toast('กำลังเชื่อมต่อ…');
  try{const r=await(await fetch(u)).json();if(!r.ok)throw 0;S.url=u;sv();rows=r.rows;cache();tab='h';render();toast('เชื่อมต่อสำเร็จ 🎉')}
  catch(e){toast('เชื่อมต่อไม่ได้ ตรวจว่า Deploy แบบ "Anyone" แล้ว')}}
async function load(){try{const r=await(await fetch(S.url)).json();if(!r.ok)throw 0;rows=r.rows;cache();render()}catch(e){toast('โหลดจากชีตไม่ได้ แสดงข้อมูลในเครื่องแทน')}}

function openSh(){const h=new Date().getHours();meal=h<10?'เช้า':h<15?'กลางวัน':h<20?'เย็น':'ของว่าง';
  $('#sh').hidden=false;$('#sd').textContent='บันทึกลง: '+label(cur);$('#q').value='';$('#rs').innerHTML='';$('#dr').hidden=true;busy();chips()}
const closeSh=()=>$('#sh').hidden=true;
function chips(){$('#mc').innerHTML=MEALS.map(m=>`<button class="${m.k==meal?'on':''}" onclick="meal='${m.k}';chips()">${m.e} ${m.k}</button>`).join('')}
function find(){
  const q=$('#q').value.trim();$('#dr').hidden=true;if(!q){$('#rs').innerHTML='';return}
  $('#rs').innerHTML=FOODS.map((f,i)=>f[0].includes(q)?`<div class="fr" onclick="pick(${i})"><span>${f[0]} <small class="mute">${f[1]}</small></span><b>${f[2]}</b></div>`:'').slice(0,40).join('')
  +`<div class="fr" onclick="ask()"><span>✨ ให้ AI ประเมิน “${esc(q)}”</span></div><div class="fr" onclick="draft($('#q').value,0,'กรอกแคลเอง')"><span>✏️ กรอกเอง</span></div>`}
function draft(n,k,note,img){base=k;qty=1;$('#dn').value=n;$('#kc').value=k;$('#qv').textContent=1;$('#nt').textContent=note||'';
  const p=$('#pv');p.hidden=!img;if(img)p.src=img;$('#dr').hidden=false;$('#rs').innerHTML='';$('#dr').scrollIntoView({behavior:'smooth'})}
function pick(i){const f=FOODS[i];draft(f[0],f[2],'ต่อ '+f[1])}
function qt(d){qty=Math.max(.5,qty+d);$('#qv').textContent=qty;$('#kc').value=Math.round(base*qty)}
async function ask(){const q=$('#q').value.trim();busy('AI กำลังประเมิน…');
  try{const r=await api({a:'ai',text:q});if(!r.ok)throw r.err;draft(r.name||q,+r.kcal||0,r.note||'ประเมินโดย AI')}
  catch(e){toast('AI ใช้ไม่ได้: '+(e.message||e))}busy()}
function scan(inp){const f=inp.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.7);busy('AI กำลังดูรูปอาหาร…');
    try{const r=await api({a:'ai',img:u.split(',')[1]});if(!r.ok)throw r.err;draft(r.name,+r.kcal||0,r.note||'ประเมินโดย AI',u)}
    catch(e){toast('อ่านรูปไม่ได้: '+(e.message||e))}busy();inp.value=''};
  im.src=URL.createObjectURL(f)}

async function save(){
  const n=$('#dn').value.trim();if(!n)return toast('ใส่ชื่ออาหารก่อนนะ');
  const r={id:'t'+Date.now(),date:cur,meal,name:n+(qty!=1?' ×'+qty:''),kcal:+$('#kc').value||0};
  rows.push(r);cache();closeSh();render();toast('บันทึกแล้ว 🌸 +'+r.kcal+' kcal');
  try{const x=await api({a:'add',...r});if(!x.ok)throw x.err;r.id=x.id;cache()}
  catch(e){rows=rows.filter(y=>y!=r);cache();render();toast('บันทึกลงชีตไม่สำเร็จ: '+(e.message||e))}}
async function del(id){
  if(!confirm('ลบรายการนี้?'))return;rows=rows.filter(r=>r.id!=id);cache();render();
  try{await api({a:'del',id})}catch(e){toast('ลบในชีตไม่สำเร็จ')}}

render();if(S.url)load();
</script>
